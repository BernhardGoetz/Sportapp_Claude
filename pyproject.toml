[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sportstunden-planer"
version = "4.0.0"
description = "Stammdaten und Bauwerkzeug des Kinderturnen-Stundenplaners (Browser-Fassung)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
packages = ["sportstunden"]

[tool.setuptools.package-data]
sportstunden = ["data/*.json"]
